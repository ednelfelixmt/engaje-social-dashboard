<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><title>Painel Marketing ZF</title><meta name='viewport' content='width=device-width,initial-scale=1'></head><body style='margin:0'><title>Painel Marketing ZF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<div id="app">
  <aside class="rail" aria-label="Páginas do painel">
    <div class="brand" title="ZF Comunicação"><img src="zf-marca.png" alt="ZF Comunicação"></div>
    <nav id="nav" style="display:contents"></nav>
    <div class="grow"></div>
    <button type="button" class="theme" id="btn-theme" title="Alternar tema claro e escuro" aria-label="Alternar tema claro e escuro">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </aside>
  <div class="main">
    <header class="top">
      <div class="title"><div class="eyebrow" id="t-eye">01 / 09</div><h1 id="t-title">Visão geral</h1><div class="eyebrow" id="t-sub" style="text-transform:none;letter-spacing:0;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--mut)"></div></div>
      <div class="chips" id="chips"></div>
      <div class="ctrls">
        <select class="sel" id="f-period" aria-label="Período"><option value="7">Últimos 7 dias</option><option value="15">Últimos 15 dias</option><option value="30">Últimos 30 dias</option></select>
        <select class="sel" id="f-plat" aria-label="Plataforma"></select>
        <select class="sel" id="f-obj" aria-label="Objetivo da campanha"></select>
        <select class="sel" id="f-grp" aria-label="Grupo de campanhas"></select>
        <button type="button" class="btn" id="btn-auto" aria-pressed="false" title="Passa as páginas sozinho (tecla P)"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>Apresentar</button>
        <div class="pager"><button type="button" id="btn-prev" aria-label="Página anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><span id="t-pg">←  →</span><button type="button" id="btn-next" aria-label="Próxima página"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
      </div>
    </header>
    <div class="empty-banner" id="banner" hidden>Nenhum dado para esta combinação de filtros. <button type="button">Limpar filtros</button></div>
    <main class="stage" id="stage"></main>
    <footer class="foot">
      <div class="autobar" id="autobar"></div>
      <div class="dots" id="dots"></div>
      <div class="zf"><span>Dados fictícios de demonstração • Setembro a outubro de 2026</span><img src="zf-marca.png" alt="ZF Comunicação"></div>
    </footer>
  </div>
</div>

<div class="scrim" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlg-h">
  <div class="dlg">
    <h2 id="dlg-h">Novo grupo de campanhas</h2>
    <label class="f" for="dlg-name">Nome do grupo<input type="text" id="dlg-name" placeholder="Ex.: Captação de alto ticket"></label>
    <div class="f" style="display:grid;gap:4px;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em">Objetivos<div class="checks" id="dlg-obj"></div></div>
    <div class="f" style="display:grid;gap:4px;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em">Plataformas<div class="checks" id="dlg-plat"></div></div>
    <label class="f" for="dlg-q">Nome da campanha contém<input type="text" id="dlg-q" placeholder="Ex.: remarketing"></label>
    <label class="f" for="dlg-min">Investimento mínimo no mês (R$)<input type="number" id="dlg-min" min="0" step="100" placeholder="0"></label>
    <div class="acts2"><button type="button" class="btn" id="dlg-cancel">Cancelar</button><button type="button" class="btn primary" id="dlg-save">Salvar grupo</button></div>
  </div>
</div>

<script src="echarts.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
