name: Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Test, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Phase 01 incremental ESLint: pin top-level versions; lockfile integration is tracked as technical debt.
      - run: npm install --no-save --package-lock=false --ignore-scripts eslint@9.39.1 typescript-eslint@8.46.0
      - run: npm run lint
      - run: npm run test
      - run: npm run verify:schema
      - run: npm run typecheck
      - run: npm run check:architecture
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
