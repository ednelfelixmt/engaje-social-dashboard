name: Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Test, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:local-migrations
      # Lint tooling is pinned in package-lock.json and installed by npm ci.
      - run: npm run lint
      - run: npm run test
      - run: npm run verify:schema
      - run: npm run typecheck
      - run: npm run check:architecture
      # Tests and typecheck ran above; skip the duplicate prebuild hook in CI.
      - run: npm run build --ignore-scripts
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify built app HTTP and anonymous access boundaries
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          APP_ORIGIN: http://127.0.0.1:3000
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/engaje-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          server_ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 --output /dev/null "$SMOKE_BASE_URL/auth/forgot-password"; then
              server_ready=true
              break
            fi
            sleep 1
          done
          if [ "$server_ready" != true ]; then
            echo "FAIL: Next.js did not become ready after 30 probes"
            cat "$RUNNER_TEMP/engaje-next.log"
            exit 1
          fi
          if ! npm run verify:http; then
            cat "$RUNNER_TEMP/engaje-next.log"
            exit 1
          fi
