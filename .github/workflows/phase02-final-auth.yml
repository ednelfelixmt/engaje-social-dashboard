name: Phase 02 Final Auth Gate
on:
  workflow_dispatch:
    inputs:
      provision_private_fixtures:
        description: 'Upload two synthetic-only branding files (never real client files)'
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: phase02-final-auth-gate
  cancel-in-progress: false
jobs:
  final-isolation:
    name: Synthetic A/B authenticated gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: phase02-homologation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Provision private synthetic fixtures through Storage API
        if: ${{ inputs.provision_private_fixtures }}
        run: node --import tsx scripts/upload-phase02-branding-fixtures.ts
        env:
          MEDIAHUB_FIXTURE_UPLOAD_ACK: UPLOAD_ONLY_SYNTHETIC_BRANDING
          MEDIAHUB_SUPABASE_URL: https://ityidnsfhgotucgvcifq.supabase.co
          MEDIAHUB_SERVICE_ROLE_KEY: ${{ secrets.PHASE02_SERVICE_ROLE_KEY }}
      - name: Real A/B authenticated read-only isolation
        run: npm run verify:production-isolation
        env:
          MEDIAHUB_PROD_READONLY_ACK: YES_READ_ONLY
          MEDIAHUB_PROD_EXISTING_FIXTURE_ACK: YES_EXPLICIT_FIXTURE_USERS
          MEDIAHUB_SUPABASE_URL: https://ityidnsfhgotucgvcifq.supabase.co
          MEDIAHUB_PUBLISHABLE_KEY: ${{ secrets.PHASE02_PUBLISHABLE_KEY }}
          MEDIAHUB_A_EMAIL: ${{ secrets.PHASE02_A_EMAIL }}
          MEDIAHUB_A_PASSWORD: ${{ secrets.PHASE02_A_PASSWORD }}
          MEDIAHUB_A_SLUG: homologacao-a-20261024
          MEDIAHUB_A_USER_ID: 079b2713-a99a-41a6-acc3-b129863ef7a6
          MEDIAHUB_A_BRANDING_FILE: c4c77b35-03a4-417a-94c2-e845d48679c1/phase02-isolation-fixture.png
          MEDIAHUB_B_EMAIL: ${{ secrets.PHASE02_B_EMAIL }}
          MEDIAHUB_B_PASSWORD: ${{ secrets.PHASE02_B_PASSWORD }}
          MEDIAHUB_B_SLUG: homologacao-b-20261024
          MEDIAHUB_B_USER_ID: 4fd21c94-e93d-4e35-923b-b1ec4622fd94
          MEDIAHUB_B_BRANDING_FILE: 10289f2d-23b9-4c86-a10e-0503bcc2de79/phase02-isolation-fixture.png
