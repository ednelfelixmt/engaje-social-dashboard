name: Phase 02 protected A/B isolation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase02-protected-ab
  cancel-in-progress: false

jobs:
  isolation:
    name: Authenticated A/B read isolation
    runs-on: ubuntu-24.04
    environment: phase02-homologation
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Assert protected fixture configuration
        env:
          MEDIAHUB_PROD_READONLY_ACK: YES_READ_ONLY
          MEDIAHUB_SUPABASE_URL: https://ityidnsfhgotucgvcifq.supabase.co
          MEDIAHUB_PUBLISHABLE_KEY: ${{ secrets.MEDIAHUB_PUBLISHABLE_KEY }}
          MEDIAHUB_A_EMAIL: ${{ secrets.MEDIAHUB_A_EMAIL }}
          MEDIAHUB_A_PASSWORD: ${{ secrets.MEDIAHUB_A_PASSWORD }}
          MEDIAHUB_A_SLUG: homologacao-a-20261024
          MEDIAHUB_A_USER_ID: ${{ secrets.MEDIAHUB_A_USER_ID }}
          MEDIAHUB_A_BRANDING_FILE: ${{ vars.MEDIAHUB_A_BRANDING_FILE }}
          MEDIAHUB_B_EMAIL: ${{ secrets.MEDIAHUB_B_EMAIL }}
          MEDIAHUB_B_PASSWORD: ${{ secrets.MEDIAHUB_B_PASSWORD }}
          MEDIAHUB_B_SLUG: homologacao-b-20261024
          MEDIAHUB_B_USER_ID: ${{ secrets.MEDIAHUB_B_USER_ID }}
          MEDIAHUB_B_BRANDING_FILE: ${{ vars.MEDIAHUB_B_BRANDING_FILE }}
          MEDIAHUB_PROD_EXISTING_FIXTURE_ACK: YES_EXPLICIT_FIXTURE_USERS
        shell: bash
        run: |
          set -euo pipefail
          for key in MEDIAHUB_PUBLISHABLE_KEY MEDIAHUB_A_EMAIL MEDIAHUB_A_PASSWORD MEDIAHUB_A_USER_ID MEDIAHUB_A_BRANDING_FILE MEDIAHUB_B_EMAIL MEDIAHUB_B_PASSWORD MEDIAHUB_B_USER_ID MEDIAHUB_B_BRANDING_FILE; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required protected fixture configuration: $key"
              exit 1
            fi
          done
      - run: npm ci --ignore-scripts
      - name: Execute read-only isolation verifier
        env:
          MEDIAHUB_PROD_READONLY_ACK: YES_READ_ONLY
          MEDIAHUB_SUPABASE_URL: https://ityidnsfhgotucgvcifq.supabase.co
          MEDIAHUB_PUBLISHABLE_KEY: ${{ secrets.MEDIAHUB_PUBLISHABLE_KEY }}
          MEDIAHUB_A_EMAIL: ${{ secrets.MEDIAHUB_A_EMAIL }}
          MEDIAHUB_A_PASSWORD: ${{ secrets.MEDIAHUB_A_PASSWORD }}
          MEDIAHUB_A_SLUG: homologacao-a-20261024
          MEDIAHUB_A_USER_ID: ${{ secrets.MEDIAHUB_A_USER_ID }}
          MEDIAHUB_A_BRANDING_FILE: ${{ vars.MEDIAHUB_A_BRANDING_FILE }}
          MEDIAHUB_B_EMAIL: ${{ secrets.MEDIAHUB_B_EMAIL }}
          MEDIAHUB_B_PASSWORD: ${{ secrets.MEDIAHUB_B_PASSWORD }}
          MEDIAHUB_B_SLUG: homologacao-b-20261024
          MEDIAHUB_B_USER_ID: ${{ secrets.MEDIAHUB_B_USER_ID }}
          MEDIAHUB_B_BRANDING_FILE: ${{ vars.MEDIAHUB_B_BRANDING_FILE }}
          MEDIAHUB_PROD_EXISTING_FIXTURE_ACK: YES_EXPLICIT_FIXTURE_USERS
        run: npm run verify:production-isolation
